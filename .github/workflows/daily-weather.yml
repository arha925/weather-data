name: daily-weather

on:
  schedule:
    # UTC 22:00 = 北京时间 06:00，每天生成一次
    - cron: '0 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成 weather.json
        run: node fetchWeather.js weather.json

      - name: 提交更新
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: daily weather update'
          file_pattern: 'weather.json'

      # jsDelivr 对 @main 分支别名的边缘缓存长达 12 小时，
      # 不主动清除的话，小程序全天读到的可能都是昨天的数据。
      - name: 清除 jsDelivr 缓存
        run: |
          echo "purge CDN cache..."
          curl -s "https://purge.jsdelivr.net/gh/arha925/weather-data@main/weather.json"
          echo ""
          echo "等待 CDN 回源..."
          sleep 15
          echo "验证线上数据日期:"
          curl -s "https://cdn.jsdelivr.net/gh/arha925/weather-data@main/weather.json" \
            | head -c 200
          echo ""
