name: daily-weather

on:
  schedule:
    # UTC 22:00 = 北京时间 06:00，每天生成一次
    - cron: '0 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成 weather.json
        run: node fetchWeather.js weather.json

      - name: 提交更新
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: daily weather update'
          file_pattern: 'weather.json'
